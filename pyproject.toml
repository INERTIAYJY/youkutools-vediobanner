[project]
name = "batch-ab-video"
version = "0.1.0"
description = "Windows desktop client for batch concatenating fixed video A with each video in a B folder."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
batch-ab-video = "batch_ab_video.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

